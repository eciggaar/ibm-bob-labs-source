name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workshop: [ccx, baw]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.workshop }}
        run: pnpm build
        env:
          WORKSHOP: ${{ matrix.workshop }}

      - name: Create GitHub App token
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ibm-bob-labs-${{ matrix.workshop }}

      - name: Deploy to ibm-bob-labs-${{ matrix.workshop }}
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ github.repository_owner }}/ibm-bob-labs-${{ matrix.workshop }}
        run: |
          cd docs/.vitepress/dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${{ matrix.workshop }} from ${{ github.sha }}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${TARGET}.git" gh-pages